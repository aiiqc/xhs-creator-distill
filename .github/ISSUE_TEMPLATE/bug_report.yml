name: Bug 报告
description: 报告可复现的 Skill 行为或文档问题
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全或隐私漏洞请使用 Security Advisory，不要在这里公开敏感细节。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v0.3.1 或 commit SHA
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 使用的宿主
      description: 请填写宿主名称和版本（如已知），不要粘贴账号或凭据。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 仅使用虚构合成内容，不要提交真实博主原文、PII 或未公开数据。
      placeholder: |
        1. 使用以下合成输入……
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 已运行的检查
      description: 列出已经验证和尚未验证的内容。
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已确认内容不包含真实博主原文、PII、凭据或其他敏感信息。
          required: true
        - label: 这不是需要私下披露的安全或隐私漏洞。
          required: true
