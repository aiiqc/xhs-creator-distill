name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Parse YAML with a safe loader
        shell: ruby {0}
        run: |
          require "yaml"

          yaml_files = Dir["agents/**/*.{yaml,yml}", ".github/**/*.{yaml,yml}"].sort
          yaml_files.each do |path|
            YAML.safe_load(File.read(path, encoding: "UTF-8"), permitted_classes: [], aliases: false)
            puts "PASS YAML #{path}"
          end

          skill_text = File.read("SKILL.md", encoding: "UTF-8")
          match = skill_text.match(/\A---\n(.*?)\n---/m)
          abort "SKILL.md frontmatter is missing or malformed" unless match
          frontmatter = YAML.safe_load(match[1], permitted_classes: [], aliases: false)
          abort "SKILL.md frontmatter must be a mapping" unless frontmatter.is_a?(Hash)
          abort "SKILL.md name must be a string" unless frontmatter["name"].is_a?(String)
          abort "SKILL.md description must be a string" unless frontmatter["description"].is_a?(String)
          puts "PASS YAML SKILL.md frontmatter"

      - name: Set up minimum supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Validate repository
        run: python3 scripts/validate_repo.py

      - name: Test validation boundaries
        run: python3 scripts/test_validate_repo.py

      - name: Test deterministic package adapter
        run: python3 scripts/test_prepare_account_package.py

  demo-golden:
    name: Demo golden outputs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Exercise documented Windows PowerShell path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $SkillRoot = (Get-Item -LiteralPath ".").FullName
          $SkillFile = Join-Path $SkillRoot "SKILL.md"
          $Adapter = Join-Path $SkillRoot "scripts\prepare_account_package.py"
          if (-not (Test-Path -LiteralPath $SkillFile -PathType Leaf)) {
            throw "SKILL.md was not found at the selected root."
          }
          if (-not (Test-Path -LiteralPath $Adapter -PathType Leaf)) {
            throw "prepare_account_package.py was not found at the selected root."
          }

          $Python = (
            Get-Command -Name "python" -CommandType Application -ErrorAction Stop |
              Select-Object -First 1
          ).Source
          & "$Python" "$Adapter" --version
          if ($LASTEXITCODE -ne 0) { throw "Adapter version check failed with exit code $LASTEXITCODE." }
          & "$Python" "$Adapter" --help
          if ($LASTEXITCODE -ne 0) { throw "Adapter help failed with exit code $LASTEXITCODE." }

          $TempRoot = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          $CanonicalInputPath = Join-Path $SkillRoot "examples\account-package-demo\input\posts.csv"
          $CanonicalInput = (Get-Item -LiteralPath $CanonicalInputPath).FullName
          $CanonicalOutput = Join-Path $TempRoot ("xhs-canonical-demo-" + [Guid]::NewGuid().ToString("N"))
          & "$Python" "$Adapter" "$CanonicalInput" "$CanonicalOutput"
          if ($LASTEXITCODE -ne 0) { throw "Canonical demo failed with exit code $LASTEXITCODE." }

          $FieldMapInputPath = Join-Path $SkillRoot "examples\field-map-demo\input\posts-export.csv"
          $FieldMapPath = Join-Path $SkillRoot "examples\field-map-demo\input\field-map.json"
          $FieldMapInput = (Get-Item -LiteralPath $FieldMapInputPath).FullName
          $FieldMap = (Get-Item -LiteralPath $FieldMapPath).FullName
          $FieldMapOutput = Join-Path $TempRoot ("xhs-field-map-demo-" + [Guid]::NewGuid().ToString("N"))
          & "$Python" "$Adapter" "$FieldMapInput" "$FieldMapOutput" --field-map "$FieldMap"
          if ($LASTEXITCODE -ne 0) { throw "Field-map demo failed with exit code $LASTEXITCODE." }

          $ExpectedArtifacts = @(
            "30-day-content-plan.csv",
            "distill-input.md",
            "evidence-map.csv",
            "inventory.csv",
            "manifest.json"
          )
          foreach ($OutputDirectory in @($CanonicalOutput, $FieldMapOutput)) {
            $ActualArtifacts = @(
              Get-ChildItem -LiteralPath $OutputDirectory -File |
                ForEach-Object { $_.Name } |
                Sort-Object
            )
            $Differences = @(
              Compare-Object -ReferenceObject $ExpectedArtifacts -DifferenceObject $ActualArtifacts
            )
            if ($Differences.Count -ne 0) {
              throw "Unexpected artifact set in ${OutputDirectory}: $($ActualArtifacts -join ', ')"
            }
            $ManifestPath = Join-Path $OutputDirectory "manifest.json"
            $Manifest = Get-Content -LiteralPath $ManifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($Manifest.status -ne "READY") {
              throw "Manifest was not READY in $OutputDirectory."
            }
          }

      - name: Compare generated demo with golden outputs
        run: >-
          python scripts/test_prepare_account_package.py
          AdapterTestCase.test_repository_demo_matches_golden_outputs -v

      - name: Compare field-map demo with golden outputs
        run: >-
          python scripts/test_prepare_account_package.py
          AdapterTestCase.test_field_map_demo_matches_golden_outputs -v
