name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Parse YAML with a safe loader
        shell: ruby {0}
        run: |
          require "yaml"

          yaml_files = Dir["agents/**/*.{yaml,yml}", ".github/**/*.{yaml,yml}"].sort
          yaml_files.each do |path|
            YAML.safe_load(File.read(path, encoding: "UTF-8"), permitted_classes: [], aliases: false)
            puts "PASS YAML #{path}"
          end

          skill_text = File.read("SKILL.md", encoding: "UTF-8")
          match = skill_text.match(/\A---\n(.*?)\n---/m)
          abort "SKILL.md frontmatter is missing or malformed" unless match
          frontmatter = YAML.safe_load(match[1], permitted_classes: [], aliases: false)
          abort "SKILL.md frontmatter must be a mapping" unless frontmatter.is_a?(Hash)
          abort "SKILL.md name must be a string" unless frontmatter["name"].is_a?(String)
          abort "SKILL.md description must be a string" unless frontmatter["description"].is_a?(String)
          puts "PASS YAML SKILL.md frontmatter"

      - name: Set up minimum supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Validate repository
        run: python3 scripts/validate_repo.py

      - name: Test validation boundaries
        run: python3 scripts/test_validate_repo.py

      - name: Test deterministic package adapter
        run: python3 scripts/test_prepare_account_package.py

  demo-golden:
    name: Demo golden outputs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compare generated demo with golden outputs
        run: >-
          python scripts/test_prepare_account_package.py
          AdapterTestCase.test_repository_demo_matches_golden_outputs -v
